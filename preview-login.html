<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Login — Agenda Agora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { 
    background: #050607; 
    color: #f3f4f6; 
    display: flex; 
    min-height: 100vh; 
    align-items: center; 
    justify-content: center;
    padding: 24px;
  }
  .hero-wash {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.15), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139,92,246,0.1), transparent);
    pointer-events: none;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: #0b0e14;
    border: 1px solid #1c2230;
    border-radius: 16px;
    padding: 32px;
    position: relative;
    z-index: 1;
  }
  .logo {
    display: block;
    margin: 0 auto 24px;
    max-width: 160px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #e5e7eb; }
  .input-wrapper { position: relative; }
  input {
    width: 100%;
    background: #050607;
    border: 1px solid #262b38;
    border-radius: 10px;
    padding: 12px 14px;
    color: #f3f4f6;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  input::placeholder { color: #6b7280; }
  .input-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #6b7280;
    pointer-events: none;
  }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #6b7280;
    cursor: pointer;
    padding: 4px;
  }
  .toggle-password:hover { color: #e5e7eb; }
  .btn {
    width: 100%;
    background: #1677ff;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #0b5ed7; }
  .btn:disabled { background: #3b82f680; cursor: not-allowed; }
  .divider { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    margin: 20px 0; 
    color: #6b7280; 
    font-size: 13px; 
  }
  .divider::before, .divider::after { 
    content: ""; 
    flex: 1; 
    height: 1px; 
    background: #262b38; 
  }
  .switch-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .switch-panel a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    transition: background 0.2s, border-color 0.2s;
  }
  .panel-primary { 
    background: #1677ff; 
    color: white; 
  }
  .panel-primary:hover { background: #0b5ed7; }
  .panel-secondary { 
    background: transparent; 
    border: 1px solid #262b38; 
    color: #e5e7eb; 
  }
  .panel-secondary:hover { border-color: #3b82f6; background: rgba(59,130,246,0.05); }
  .icon { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="hero-wash"></div>
  
  <div class="login-card">
    <svg class="logo" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#f3f4f6">AGENDA</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#3b82f6" dx="85">AGORA</text>
    </svg>
    
    <h1>Entrar no painel</h1>
    <p class="subtitle">Estabelecimentos entram com telefone e senha de 4 dígitos; profissionais, com seu e-mail.</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Telefone ou e-mail</label>
        <div class="input-wrapper">
          <input 
            id="identifier" 
            type="text" 
            autocomplete="username" 
            placeholder="(11) 93935-4416" 
            required
            inputmode="text"
          />
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Senha (4 dígitos)</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="1234" 
            maxlength="4" 
            required
            inputmode="numeric"
            pattern="\d{4}"
          />
          <button type="button" class="toggle-password" aria-label="Mostrar senha">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn">Entrar</button>
    </form>
    
    <div class="divider">ou acesse</div>
    
    <div class="switch-panel">
      <a href="#" class="panel-primary">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <path d="M8 21h8"></path>
          <path d="M12 17v4"></path>
        </svg>
        Painel do estabelecimento
      </a>
      <a href="#" class="panel-secondary">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Administração da plataforma
      </a>
    </div>
  </div>

  <script>
    // Formata telefone enquanto digita
    const identifierInput = document.getElementById('identifier');
    identifierInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);
      
      if (value.length <= 2) {
        e.target.value = value;
      } else if (value.length <= 6) {
        e.target.value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
      } else if (value.length <= 10) {
        e.target.value = `(${value.slice(0, 2)}) ${value.slice(2, 6)}-${value.slice(6)}`;
      } else {
        e.target.value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
      }
    });

    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.querySelector('.toggle-password');
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.innerHTML = isPassword 
        ? '<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
    });

    // Form submit (demo)
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Aguarde...';
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        alert('Demo: formulário enviado!\nTelefone: ' + identifierInput.value + '\nSenha: ' + passwordInput.value);
      }, 1500);
    });
  </script>
</body>
</html>
