<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Abas do Painel Master</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #050607;
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .bloco { max-width: 900px; width: 100%; margin: 0 auto; }
  .titulo {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: #4f5660;
    margin-bottom: 10px;
  }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding-bottom: 4px;
  }
  button {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: #777d87;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: color .2s;
  }
  button:hover { color: #e6e9ee; }
  button.ativo { border-bottom-color: #69a2ff; color: #8fb3ff; }
  svg { width: 16px; height: 16px; }
  .nota { color: #626872; font-size: 12px; margin-top: 10px; }
  .antigo { opacity: .5; }
  .riscado { position: relative; text-decoration: line-through; text-decoration-color: #ff4d4f; text-decoration-thickness: 2px; }
</style>
</head>
<body>
  <div class="bloco antigo">
    <p class="titulo">Antes (6 abas)</p>
    <nav>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Visão geral</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agendamentos</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Desempenho</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Assinatura</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Atividade</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Suporte</button>
    </nav>
    <p class="nota">Visão geral, Assinatura e Suporte removidas.</p>
  </div>

  <div class="bloco">
    <p class="titulo">Agora (3 abas)</p>
    <nav>
      <button class="ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agendamentos</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Desempenho</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Atividade</button>
    </nav>
    <p class="nota">O painel agora abre direto em <b style="color:#8fb3ff">Agendamentos</b>, com a aba ativa sublinhada em azul.</p>
  </div>
</body>
</html>
